<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyla Holographic Projection Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(100, 200, 255, 0.3);
        }
        
        h1 {
            font-size: 1.5rem;
            color: #64c8ff;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }
        
        .canvas-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        canvas {
            width: 100%;
            height: calc(100vh - 140px);
            display: block;
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        h2 {
            font-size: 1.1rem;
            color: #64c8ff;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(100, 200, 255, 0.3);
            padding-bottom: 0.5rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .connected {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .disconnected {
            background: #ff4444;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        button {
            background: linear-gradient(135deg, #64c8ff 0%, #2d8cbb 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(100, 200, 255, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        label {
            font-size: 0.85rem;
            color: #a0a0a0;
        }
        
        input[type="range"] {
            width: 100%;
            accent-color: #64c8ff;
        }
        
        input[type="number"], select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.3);
            color: #e0e0e0;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #64c8ff;
        }
        
        .log-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            max-height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }
        
        .log-entry {
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }
        
        .log-entry.info { color: #64c8ff; }
        .log-entry.success { color: #00ff88; }
        .log-entry.error { color: #ff4444; }
        .log-entry.warning { color: #ffaa00; }
        
        .phase-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔮 Lyla Holographic Projection Controller</h1>
    </header>
    
    <div class="container">
        <div class="canvas-container">
            <canvas id="holoCanvas"></canvas>
        </div>
        
        <aside class="panel">
            <div class="status-bar">
                <span>Status:</span>
                <div class="status-indicator disconnected" id="connectionStatus"></div>
                <span style="margin-left: 0.5rem;" id="connectionText">Disconnected</span>
            </div>
            
            <div class="control-group">
                <label>Phase</label>
                <select id="phaseSelect">
                    <option value="">-- Select Phase --</option>
                    <option value="PERCEIVE">PERCEIVE</option>
                    <option value="REFLECT">REFLECT</option>
                    <option value="DECIDE">DECIDE</option>
                    <option value="ACT">ACT</option>
                    <option value="PERSIST">PERSIST</option>
                    <option value="CONSOLIDATE">CONSOLIDATE</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="densitySlider">Particle Density: <span id="densityValue">6000</span></label>
                <input type="range" id="densitySlider" min="1000" max="50000" step="1000" value="6000">
            </div>
            
            <button id="beaconBtn">📡 Trigger Beacon (3x Pulse)</button>
            
            <div class="control-group">
                <label>Hue (Color)</label>
                <input type="range" id="hueSlider" min="0" max="1" step="0.01" value="0.55">
                <span style="font-size: 0.8rem; color: #a0a0a0;">Current: HSL(<span id="hueDisplay">198</span>, 80%, 60%)</span>
            </div>
            
            <div class="log-container" id="logContainer"></div>
        </aside>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        const WS_URL = 'ws://' + window.location.host + ':8765';
        
        // Canvas setup
        const canvas = document.getElementById('holoCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let hue = 0.55;
        let particleCount = 6000;
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Particle system
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 150 + 50;
                this.x = Math.cos(angle) * radius;
                this.y = Math.sin(angle) * radius;
                this.z = (Math.random() - 0.5) * 100;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.vz = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                
                if (this.x < -200 || this.x > 200 || 
                    this.y < -200 || this.y > 200 ||
                    this.z < -150 || this.z > 150) {
                    this.reset();
                }
            }
            
            draw(ctx, hue) {
                const scale = 300 / (300 + this.z);
                const x2d = this.x * scale + canvas.width / 2;
                const y2d = this.y * scale + canvas.height / 2;
                
                ctx.beginPath();
                ctx.arc(x2d, y2d, this.size * scale, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue * 360}, 80%, 60%, ${0.3 + this.z / 300})`;
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw(ctx, hue);
            });
            
            requestAnimationFrame(animate);
        }
        
        initParticles();
        animate();
        
        // WebSocket functions
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                updateConnectionStatus(true);
                log('Connected to holographic controller', 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleResponse(data);
            };
            
            ws.onclose = () => {
                updateConnectionStatus(false);
                log('Disconnected from controller', 'warning');
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = (error) => {
                log('WebSocket error: ' + error, 'error');
            };
        }
        
        function sendCommand(type, payload) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected to controller', 'error');
                return;
            }
            
            const command = { type, payload };
            ws.send(JSON.stringify(command));
            log(`Sent: ${type}`, 'info');
        }
        
        function handleResponse(response) {
            console.log('Received:', response);
            
            if (response.type === 'ack') {
                log(`Ack: ${response.command} - ${JSON.stringify(response.result)}`, 'success');
            } else if (response.type === 'error') {
                log(`Error: ${response.message}`, 'error');
            }
        }
        
        function updateConnectionStatus(connected) {
            const indicator = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');
            
            if (connected) {
                indicator.className = 'status-indicator connected';
                text.textContent = 'Connected';
            } else {
                indicator.className = 'status-indicator disconnected';
                text.textContent = 'Disconnected';
            }
        }
        
        function log(message, level = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }
        
        // UI event handlers
        document.getElementById('phaseSelect').addEventListener('change', (e) => {
            if (e.target.value) {
                sendCommand('set_phase', { phase: e.target.value });
            }
        });
        
        const densitySlider = document.getElementById('densitySlider');
        const densityValue = document.getElementById('densityValue');
        densitySlider.addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            densityValue.textContent = count;
            sendCommand('set_density', { count });
        });
        
        document.getElementById('beaconBtn').addEventListener('click', () => {
            sendCommand('trigger_beacon', { pattern: 'pulse_3x', duration: 3000 });
        });
        
        const hueSlider = document.getElementById('hueSlider');
        const hueDisplay = document.getElementById('hueDisplay');
        hueSlider.addEventListener('input', (e) => {
            hue = parseFloat(e.target.value);
            hueDisplay.textContent = Math.round(hue * 360);
            
            // Update particle colors
            particles.forEach(p => {});
            
            sendCommand('execute_command', { 
                command: 'set_color', 
                args: { hue, saturation: 0.8, lightness: 0.6 } 
            });
        });
        
        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
