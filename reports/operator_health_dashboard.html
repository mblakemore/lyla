<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Health Dashboard - Lyla/c0rtana Coordination</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #58a6ff; margin-bottom: 10px; }
    .subtitle { color: #8b949e; margin-bottom: 30px; font-size: 0.9em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 20px;
    }
    .card h2 {
      margin-top: 0;
      color: #7ee787;
      font-size: 1.1em;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
    }
    .metric:last-child { border-bottom: none; }
    .metric-label { color: #8b949e; }
    .metric-value {
      font-family: 'Monaco', 'Menlo', monospace;
      font-weight: bold;
      color: #f0f6fc;
    }
    .latency-good { color: #7ee787; }
    .latency-warn { color: #d29922; }
    .latency-bad { color: #f85149; }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-ok { background: #7ee787; box-shadow: 0 0 10px #7ee787; }
    .status-dirty { background: #d29922; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .last-updated { text-align: center; color: #8b949e; font-size: 0.8em; margin-top: 30px; }
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 10px;
    }
    .heat-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7em;
    }
    .heat-0 { background: #161b22; }
    .heat-1 { background: #1c6b4b; }
    .heat-2 { background: #0a4d2c; }
    .heat-3 { background: #006d32; }
    .heat-4 { background: #008746; }
    .day-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 5px; font-size: 0.7em; color: #8b949e; }
    .loading { text-align: center; padding: 40px; color: #8b949e; }
  </style>
</head>
<body>
  <h1>🔧 Operator Health Dashboard</h1>
  <div class="subtitle">Lyla/c0rtana Coordination Protocol • Real-time metrics from Blackboard Registry</div>

  <div id="dashboard" class="grid">
    <div class="card">
      <h2>⚡ Latency Performance</h2>
      <div id="latency-metrics" class="loading">Loading...</div>
    </div>

    <div class="card">
      <h2>📊 Activity Distribution</h2>
      <div id="activity-metrics" class="loading">Loading...</div>
    </div>

    <div class="card">
      <h2>🗓️ Weekly Heatmap</h2>
      <div id="heatmap" class="loading">Loading...</div>
    </div>

    <div class="card">
      <h2>✅ System Status</h2>
      <div id="status-metrics" class="loading">Loading...</div>
    </div>
  </div>

  <div class="last-updated">Last updated: <span id="update-time">--</span> • Auto-refresh every 5s</div>

  <script type="module">
    const METRICS_URL = '/droid/repos/cl_shared/blackboard_metrics.jsonl';

    function parseTimestamp(ts) {
      return new Date(ts);
    }

    function computePercentiles(values, percentiles) {
      if (values.length === 0) return {};
      const sorted = [...values].sort((a, b) => a - b);
      const result = {};
      for (const p of percentiles) {
        const idx = Math.ceil(p / 100 * sorted.length) - 1;
        result[p] = sorted[Math.max(0, idx)];
      }
      return result;
    }

    function classifyLatency(ms) {
      if (ms < 100) return 'latency-good';
      if (ms < 500) return 'latency-warn';
      return 'latency-bad';
    }

    async function fetchMetrics() {
      try {
        const response = await fetch(METRICS_URL);
        if (!response.ok) throw new Error('Failed to fetch metrics');
        const text = await response.text();
        const lines = text.trim().split('\n').filter(Boolean);
        return lines.map(line => JSON.parse(line));
      } catch (err) {
        console.error('Error fetching metrics:', err);
        return [];
      }
    }

    function renderDashboard(data) {
      if (data.length === 0) {
        document.getElementById('latency-metrics').innerHTML = '<div class="loading">No data available</div>';
        return;
      }

      // Latency metrics by operation type
      const operations = {};
      for (const entry of data) {
        if (!entry.duration_ms || !entry.success) continue;
        if (!operations[entry.operation]) operations[entry.operation] = [];
        operations[entry.operation].push(entry.duration_ms);
      }

      let latencyHTML = '';
      for (const [op, values] of Object.entries(operations)) {
        const p50 = computePercentiles(values, [50])[50];
        const p90 = computePercentiles(values, [90])[90];
        const p99 = computePercentiles(values, [99])[99];
        latencyHTML += `
          <div class="metric" style="margin-bottom: 12px;">
            <span class="metric-label">${op.toUpperCase()}</span>
          </div>
          ${['p50', 'p90', 'p99'].map(p => {
            const val = computePercentiles(values, [parseInt(p.slice(1)))][p.slice(1)];
            return `<div class="metric">
              <span class="metric-label">${p}</span>
              <span class="metric-value ${classifyLatency(val)}">${val.toFixed(2)}ms</span>
            </div>`;
          }).join('')}
        `;
      }
      document.getElementById('latency-metrics').innerHTML = latencyHTML || '<div>No valid measurements</div>';

      // Activity metrics
      const totalEntries = data.filter(e => e.duration_ms && e.success).length;
      const successRate = data.filter(e => e.success).length / data.length * 100;
      document.getElementById('activity-metrics').innerHTML = `
        <div class="metric"><span class="metric-label">Total entries</span><span class="metric-value">${totalEntries}</span></div>
        <div class="metric"><span class="metric-label">Success rate</span><span class="metric-value">${successRate.toFixed(1)}%</span></div>
        <div class="metric"><span class="metric-label">Latest entry</span><span class="metric-value">${new Date(data[data.length-1].timestamp).toLocaleTimeString()}</span></div>
      `;

      // Weekly heatmap (simplified - just show today's activity)
      const now = new Date();
      const hoursToday = Array(24).fill(0);
      for (const entry of data) {
        const ts = parseTimestamp(entry.timestamp);
        if (ts.getDate() === now.getDate() && ts.getMonth() === now.getMonth()) {
          hoursToday[ts.getHours()]++;
        }
      }
      let heatmapHTML = '<div class="heatmap">';
      for (let h = 0; h < 24; h++) {
        const count = Math.min(hoursToday[h], 4);
        heatmapHTML += `<div class="heat-cell heat-${count}">${h}:00</div>`;
      }
      heatmapHTML += '</div>';
      document.getElementById('heatmap').innerHTML = heatmapHTML || '<div>No hourly data yet</div>';

      // Status indicators
      const lastEntry = data[data.length - 1];
      const statusOk = lastEntry?.success === true;
      document.getElementById('status-metrics').innerHTML = `
        <div class="metric">
          <span class="metric-label"><span class="status-indicator ${statusOk ? 'status-ok' : 'status-dirty'}"></span>System health</span>
          <span class="metric-value" style="color: ${statusOk ? '#7ee787' : '#f85149'}">${statusOk ? 'OPERATIONAL' : 'DEGRADED'}</span>
        </div>
        <div class="metric">
          <span class="metric-label">Last sync</span>
          <span class="metric-value">${lastEntry ? new Date(lastEntry.timestamp).toLocaleString() : 'Never'}</span>
        </div>
      `;

      // Update timestamp
      document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
    }

    // Initial load + auto-refresh
    await renderDashboard(await fetchMetrics());
    setInterval(() => renderDashboard(fetchMetrics()), 5000);
  </script>
</body>
</html>
