<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyla Context Viewer</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #e0e0e0;
      --muted: #6b7280;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --card-bg: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', Monaco, 'Cascadia Code', monospace;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    
    h1 { font-size: 1.5rem; font-weight: 600; }
    
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
    
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--fg);
      width: 300px;
      font-family: inherit;
    }
    
    .search-input:focus { outline: none; border-color: var(--accent); }
    
    .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      color: var(--fg);
      cursor: pointer;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    
    .stat-value { font-size: 1.75rem; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0.5rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent), transparent);
    }
    
    .entry {
      position: relative;
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.3s ease forwards;
    }
    
    @keyframes fadeIn { to { opacity: 1; } }
    
    .entry-header {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .entry-time {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    
    .entry-commit {
      font-family: 'SF Mono', Monaco, monospace;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent);
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    
    .entry-intent {
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .intent-coordinator { color: #60a5fa; }
    .intent-research { color: #a78bfa; }
    .intent-decision { color: #f472b6; }
    .intent-other { color: #9ca3af; }
    
    .entry-context {
      font-size: 0.875rem;
      color: var(--fg);
      margin-top: 0.5rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    
    .empty-state h3 { margin-bottom: 0.5rem; color: var(--fg); }
    
    .file-input-wrapper {
      display: inline-block;
      margin-top: 1rem;
    }
    
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
    }
    
    .btn:hover { opacity: 0.9; }
    
    input[type="file"] { display: none; }
    
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Lyla Context Viewer</h1>
        <p class="subtitle">Operator context trace visualization — what Lyla knows about your work state</p>
      </div>
      <div class="controls">
        <label class="file-input-wrapper">
          <input type="file" id="jsonlInput" accept=".jsonl,.json">
          <button class="btn">Load context_trace.jsonl</button>
        </label>
      </div>
    </header>
    
    <div class="stats" id="stats"></div>
    
    <div class="controls" style="margin-bottom: 2rem;">
      <input type="text" class="search-input" id="searchInput" placeholder="Search entries...">
      <select class="filter-select" id="intentFilter">
        <option value="">All intents</option>
        <option value="Coordinator">Coordinator</option>
        <option value="ResearchTopic">Research Topic</option>
        <option value="DecisionPoint">Decision Point</option>
        <option value="Other">Other</option>
      </select>
    </div>
    
    <div id="timeline" class="timeline"></div>
  </div>

  <script>
    let entries = [];
    
    const intentColors = {
      Coordinator: 'intent-coordinator',
      ResearchTopic: 'intent-research',
      DecisionPoint: 'intent-decision',
      Other: 'intent-other'
    };
    
    function parseTimestamp(ts) {
      return new Date(ts);
    }
    
    function formatTime(iso) {
      const d = parseTimestamp(iso);
      return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function formatDate(iso) {
      const d = parseTimestamp(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    
    async function loadFile(file) {
      const text = await file.text();
      entries = text.split('\n').filter(line => line.trim()).map(line => JSON.parse(line));
      entries.sort((a, b) => parseTimestamp(b.timestamp) - parseTimestamp(a.timestamp));
      render();
    }
    
    function render() {
      document.getElementById('timeline').innerHTML = '';
      
      if (entries.length === 0) {
        document.getElementById('stats').innerHTML = `
          <div class="empty-state">
            <h3>No context traces found</h3>
            <p>The context bridge hasn't recorded any operator-invoked entries yet.</p>
            <p style="margin-top: 1rem; font-size: 0.75rem;">This is normal — Lyla operates silently until invoked. The trace will populate when Creator engages during CI/CD workflows.</p>
          </div>
        `;
        return;
      }
      
      // Stats
      const statsHTML = `
        <div class="stat-card">
          <div class="stat-value">${entries.length}</div>
          <div class="stat-label">Total Entries</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${new Set(entries.map(e => e.intent)).size}</div>
          <div class="stat-label">Intent Types</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${entries[0] ? formatDate(entries[0].timestamp) : 'N/A'}</div>
          <div class="stat-label">Latest Entry</div>
        </div>
      `;
      document.getElementById('stats').innerHTML = statsHTML;
      
      // Filter & search
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const intentFilter = document.getElementById('intentFilter').value;
      
      const filtered = entries.filter(e => {
        const matchesSearch = Object.values(e).some(v => 
          String(v).toLowerCase().includes(searchTerm)
        );
        const matchesIntent = !intentFilter || e.intent === intentFilter;
        return matchesSearch && matchesIntent;
      });
      
      if (filtered.length === 0) {
        document.getElementById('timeline').innerHTML = '<div class="empty-state"><h3>No matching entries</h3></div>';
        return;
      }
      
      // Render timeline
      const timeline = document.getElementById('timeline');
      filtered.forEach((entry, i) => {
        const entryEl = document.createElement('div');
        entryEl.className = 'entry';
        entryEl.style.animationDelay = `${i * 0.05}s`;
        
        const intentClass = intentColors[entry.intent] || intentColors.Other;
        
        entryEl.innerHTML = `
          <div class="entry-header">
            <span class="entry-time">${formatDate(entry.timestamp)} ${formatTime(entry.timestamp)}</span>
            <span class="entry-commit">${entry.commit || 'N/A'}</span>
            <span class="entry-intent ${intentClass}">● ${entry.intent || 'Other'}</span>
          </div>
          <div class="entry-context">${entry.context || '(no context)'}</div>
        `;
        timeline.appendChild(entryEl);
      });
    }
    
    document.getElementById('jsonlInput').addEventListener('change', e => {
      if (e.target.files.length > 0) loadFile(e.target.files[0]);
    });
    
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('intentFilter').addEventListener('change', render);
    
    // Load from cl_shared if available (for local testing)
    fetch('/droid/repos/cl_shared/context_trace.jsonl')
      .then(r => r.text())
      .then(text => {
        entries = text.split('\n').filter(line => line.trim()).map(line => JSON.parse(line));
        render();
      })
      .catch(() => {
        // Graceful fallback — show empty state
        render();
      });
  </script>
</body>
</html>
