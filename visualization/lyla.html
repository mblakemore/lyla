<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyla | Holographic Form</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            pointer-events: none;
            text-shadow: 0 0 5px #0ff;
            opacity: 0.7;
            z-index: 10;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="core-status">LYLA_CORE: ACTIVE</div>
        <div id="state-display">FETCHING STATE...</div>
        <div id="pattern-display">PATTERNS: 0</div>
        <div id="health-display">HEALTH: UNKNOWN</div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.160';

        const PHASE_COLORS = {
            'PERCEIVE': 0x00ffff,   // Cyan
            'REFLECT': 0xaa00ff,    // Purple
            'DECIDE': 0xffff00,    // Yellow
            'ACT': 0xff4400,       // Orange
            'CONSOLIDATE': 0x00ff00,// Green
            'PERSIST': 0xffffff,   // White
            'DEFAULT': 0x4444ff    // Deep Blue
        };

        let scene, camera, renderer, particles, orbits = [];
        let currentState = { phase: 'DEFAULT', cycle: 0, confidence: 0.5, health: 'Healthy' };
        let patternCount = 0;

        async function fetchState() {
            try {
                const stateRes = await fetch('./state/current-state.json');
                if (stateRes.ok) {
                    const data = await stateRes.json();
                    currentState = data;
                    document.getElementById('state-display').innerText = 
                        `CYCLE: ${data.cycle} | PHASE: ${data.phase || 'IDLE'} | STATUS: ${data.status}`;
                }

                const patRes = await fetch('./state/memories/patterns.jsonl');
                if (patRes.ok) {
                    const text = await patRes.text();
                    const lines = text.trim().split('\\n').filter(line => line.length > 0);
                    patternCount = lines.length;
                    document.getElementById('pattern-display').innerText = `PATTERNS: ${patternCount}`;
                    updateDensity();
                }

                const healthRes = await fetch('./state/repo-health.json');
                if (healthRes.ok) {
                    const hData = await healthRes.json();
                    currentState.health = hData.status || 'Unknown';
                    document.getElementById('health-display').innerText = `HEALTH: ${currentState.health}`;
                }
            } catch (e) {
                console.error("State fetch failed:", e);
            }
        }

        function updateDensity() {
            const targetCount = Math.min(1000 + (patternCount * 50), 10000);
            if (particles && particles.geometry.attributes.position.count !== targetCount) {
                disposeParticles();
                createParticles(targetCount);
            }
        }

        function createParticles(count) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 4;
                colors[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.015,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createOrbit(radius, color) {
            const geometry = new THREE.BufferGeometry();
            const points = [];
            for(let i=0; i<200; i++) {
                const angle = (i / 200) * Math.PI * 2;
                points.push(Math.cos(angle)*radius, (Math.random()-0.5)*0.1, Math.sin(angle)*radius);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
            const material = new THREE.PointsMaterial({ size: 0.02, color: color, transparent: true, opacity: 0 });
            const orbit = new THREE.Points(geometry, material);
            scene.add(orbit);
            return orbit;
        }

        function disposeParticles() {
            if (particles) {
                scene.remove(particles);
                particles.geometry.dispose();
                particles.material.dispose();
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            createParticles(2000);
            orbits.push(createOrbit(1.5, PHASE_COLORS['REFLECT']));
            orbits.push(createOrbit(2.0, PHASE_COLORS['DECIDE']));

            window.addEventListener('resize', onWindowResize, false);
            animate();
            
            setInterval(fetchState, 2000);
            fetchState();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            
            if (particles) {
                const phase = currentState.phase || 'DEFAULT';
                let rotSpeed = 0.002;
                
                if (phase === 'ACT') rotSpeed = 0.01;
                if (phase === 'REFLECT') rotSpeed = 0.005;
                
                particles.rotation.y += rotSpeed;
                particles.rotation.x += 0.001;

                let vibration = 0;
                if (currentState.health !== 'Healthy') {
                    vibration = Math.sin(time * 10) * 0.05;
                }
                particles.position.x = vibration;

                const confidence = currentState.confidence || 0.5;
                const baseColor = new THREE.Color(PHASE_COLORS[phase] || PHASE_COLORS['DEFAULT']);
                
                if (currentState.health !== 'Healthy') {
                    baseColor.lerp(new THREE.Color(0xff0000), 0.4);
                }

                const finalColor = baseColor.clone().lerp(new THREE.Color(0xffffff), confidence * 0.6);
                particles.material.color.set(finalColor);

                const pulseFreq = 1 + (currentState.cycle * 0.01);
                const pulse = Math.sin(time * pulseFreq) * 0.1;
                particles.position.z = pulse;
            }

            // Orbit animation logic
            const phase = currentState.phase || 'DEFAULT';
            orbits.forEach((orbit, idx) => {
                const targetOpacity = (phase === 'REFLECT' && idx === 0) || (phase === 'DECIDE' && idx === 1) ? 0.8 : 0.1;
                orbit.material.opacity += (targetOpacity - orbit.material.opacity) * 0.05;
                orbit.rotation.y += 0.01 * (idx + 1);
                orbit.rotation.x += 0.005;
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
