<!DOCTYPE html>
<html>
<head>
  <title>Lyla - Holographic Presence</title>
  <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three@0.160';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Particle system for Lyla's form
  const particleCount = 2000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 10;
    colors[i] = Math.random();
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.8 });
  const points = new THREE.Points(geometry, material);
  scene.add(points);

  camera.position.z = 5;

  async function updateState() {
    try {
      // In a real environment, this would fetch state/current-state.json
      // For the mockup, we'll simulate response based on current known cycle (50)
      const response = await fetch('/state/current-state.json').catch(() => ({ json: () => ({ phase: 'ACT', confidence: 0.9 }) }));
      const data = await response.json();
      
      // Map Phase to movement pattern
      if (data.phase === 'ACT') {
        points.rotation.y += 0.02;
      } else if (data.phase === 'REFLECT') {
        points.rotation.x += 0.01;
      }

      // Map Confidence to color (Cyan for low, Orange for high)
      const hue = data.confidence > 0.7 ? 0.1 : 0.5; // Rough mapping
      material.color.setHSL(hue, 1.0, 0.5);
    } catch (e) {
      console.log("Polling state...");
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    points.rotation.y += 0.001;
    renderer.render(scene, camera);
  }

  setInterval(updateState, 2000);
  animate();
</script>
</body>
</html>
