<!DOCTYPE html>
<html>
<head>
  <title>Lyla - Holographic Presence</title>
  <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three@0.160';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Particle system for Lyla's form
  const particleCount = 4000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const initialPositions = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount * 3; i++) {
    const val = (Math.random() - 0.5) * 10;
    positions[i] = val;
    initialPositions[i] = val;
    colors[i] = Math.random();
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.8 });
  const points = new THREE.Points(geometry, material);
  scene.add(points);

  camera.position.z = 7;

  // Cognitive State Variables
  let currentState = { phase: 'IDLE', confidence: 0.5, trend: { delta: 0 } };
  let eventPerturbation = { intensity: 0, type: null, timestamp: 0 };
  let frameCount = 0;

  // Resonance / HOP State
  let resonanceState = {
    pulse: 0,
    targetResonance: 0,
    hopActive: false
  };

  async function updateState() {
    try {
      const response = await fetch('/state/current-state.json').catch(() => ({ json: () => ({ phase: 'ACT', confidence: 0.9 }) }));
      const data = await response.json();
      currentState = data;
      
      if (data.last_event) {
        triggerEvent(data.last_event.type);
      }
    } catch (e) {
      console.log("Polling state...");
    }
  }

  async function pollCorrelations() {
    try {
      const response = await fetch('/state/correlations.json');
      const data = await response.json();
      const hops = data.higher_order_patterns || [];
      
      if (hops.length > 0) {
        // Strength is a factor of count and individual strengths
        const avgStrength = hops.reduce((acc, hop) => acc + hop.strength, 0) / hops.length;
        resonanceState.targetResonance = Math.min(avgStrength * 0.5, 1.0);
        resonanceState.hopActive = true;
      } else {
        resonanceState.targetResonance = 0;
        resonanceState.hopActive = false;
      }
    } catch (e) {
      console.error("Correlation Sync Error:", e);
    }
  }

  function triggerEvent(type) {
    console.log(`Cognitive Event Detected: ${type}`);
    eventPerturbation.intensity = 1.0;
    eventPerturbation.type = type;
    eventPerturbation.timestamp = Date.now();
  }

  function applyVisuals(time) {
    const posAttr = geometry.attributes.position;
    
    // Handle Resonance Lerp
    resonanceState.pulse += (resonanceState.targetResonance - resonanceState.pulse) * 0.05;
    const resFreq = 2.0 + (resonanceState.pulse * 8.0);
    const resOscillation = Math.sin(time * 0.001 * resFreq) * 0.5 + 0.5;
    const activeResonance = resonanceState.pulse * resOscillation;

    // Dynamic Decay based on Trend Delta
    const elapsed = (Date.now() - eventPerturbation.timestamp) / 1000;
    const trendVolatility = Math.abs(currentState.trend?.delta || 0) + 1.0;
    const decayConstant = 2.0 * trendVolatility;
    const decay = Math.exp(-elapsed * decayConstant); 
    const pIntensity = eventPerturbation.intensity * decay;

    frameCount++;
    if (frameCount % 300 === 0) {
      console.log(`[C54-Telemetry] Phase: ${currentState.phase} | ResPulse: ${activeResonance.toFixed(4)} | Intensity: ${pIntensity.toFixed(4)}`);
    }

    for (let i = 0; i < particleCount; i++) {
      const ix = i * 3;
      const iy = i * 3 + 1;
      const iz = i * 3 + 2;

      let drift = 0.1;
      if (currentState.phase === 'ACT') drift = 0.5;
      if (currentState.phase === 'REFLECT') drift = 0.2;
      
      const angle = time * 0.001 + i;
      
      let ox = 0, oy = 0, oz = 0;
      if (pIntensity > 0.01) {
        const burst = pIntensity * 2.0;
        ox = Math.cos(angle) * burst;
        oy = Math.sin(angle) * burst;
        oz = Math.sin(angle * 0.8) * burst;
      }

      // Apply Resonance Spikes - higher frequency jitter and outward push
      const resPush = activeResonance * 1.5;
      const resJitter = (Math.random() - 0.5) * activeResonance * 0.5;

      posAttr.array[ix] = initialPositions[ix] + Math.cos(angle) * drift + ox + resPush * Math.cos(angle) + resJitter;
      posAttr.array[iy] = initialPositions[iy] + Math.sin(angle) * drift + oy + resPush * Math.sin(angle) + resJitter;
      posAttr.array[iz] = initialPositions[iz] + Math.cos(angle * 0.7) * drift + oz + resPush * Math.cos(angle * 0.7) + resJitter;
    }
    posAttr.needsUpdate = true;

    // Color Mapping: Cyan/Blue -> Gold/Purple for resonance
    if (activeResonance > 0.2) {
      // Blend toward gold-ish hue based on resonance strength
      const hue = 0.15 + (activeResonance * 0.1); // Shift from orange-gold to yellow
      material.color.setHSL(hue, 0.9, 0.5 + (pIntensity * 0.3));
    } else {
      const hue = currentState.confidence > 0.7 ? 0.05 : 0.6; 
      material.color.setHSL(hue, 0.8, 0.5 + (pIntensity * 0.3));
    }
  }

  function animate(time) {
    requestAnimationFrame(animate);
    applyVisuals(time);
    points.rotation.y += 0.002;
    renderer.render(scene, camera);
  }

  setInterval(updateState, 2000);
  setInterval(pollCorrelations, 3000);
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
