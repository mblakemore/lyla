<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyla | Holographic Form</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            pointer-events: none;
            text-shadow: 0 0 5px #0ff;
            opacity: 0.7;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <div>LYLA_CORE: ACTIVE</div>
        <div id="state-display">FETCHING STATE...</div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.160';

        // Configuration mapping from state to visuals
        const PHASE_COLORS = {
            'PERCEIVE': 0x00ffff,   // Cyan
            'REFLECT': 0xaa00ff,   // Purple
            'DECIDE': 0xffff00,    // Yellow
            'ACT': 0xff4400,       // Orange
            'CONSOLIDATE': 0x00ff00,// Green
            'PERSIST': 0xffffff,   // White
            'DEFAULT': 0x4444ff    // Deep Blue
        };

        let scene, camera, renderer, particles, particleSystem;
        let currentState = { phase: 'DEFAULT', cycle: 0 };

        async function fetchState() {
            try {
                const response = await fetch('./state/current-state.json');
                if (response.ok) {
                    const data = await response.json();
                    currentState = data;
                    document.getElementById('state-display').innerText = 
                        `CYCLE: ${data.cycle} | PHASE: ${data.last_phase || 'IDLE'} | STATUS: ${data.status}`;
                    updateVisuals();
                }
            } catch (e) {
                console.error("State fetch failed:", e);
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Create Particle System
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 4;
                colors[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.015,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize, false);
            animate();
            
            // Start polling state every 2 seconds as per AGENT.md
            setInterval(fetchState, 2000);
            fetchState();
        }

        function updateVisuals() {
            const colorHex = PHASE_COLORS[currentState.last_phase] || PHASE_COLORS['DEFAULT'];
            const color = new THREE.Color(colorHex);
            
            particleSystem.material.color.set(color);
            
            // Adjust particle density/spread based on cycle number (subtle effect)
            const scale = 1 + (currentState.cycle * 0.001);
            particleSystem.scale.set(scale, scale, scale);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;
            
            // Subtle oscillation and rotation
            particleSystem.rotation.y += 0.002;
            particleSystem.rotation.x += 0.001;
            
            // Pulse movement
            const pulse = Math.sin(time) * 0.1;
            particleSystem.position.z = pulse;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
